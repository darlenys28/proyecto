{% extends "base.html" %}

{% block title %}Ventas - Administrador{% endblock %}

{% block body %}

<div class="container mt-5">

    <h2 class="text-center mb-4">Gestión de Ventas</h2>


    <!-- 🔹 TABLA -->
    <div class="table-responsive">
        <table class="table table-striped table-hover text-center align-middle">

            <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Usuario</th>
                    <th>Correo</th>
                </tr>
            </thead>

            <tbody>
                {% if usuario %}
                {% for u in usuarios %}
                <tr>
                    <td>{{ u[0] }}</td>
                    <td>{{ u[1] }}</td>
                    <td>{{ u[2] }} </td>
                </tr>
                {% endfor %}
                {% else %}
                <tr>
                    <td colspan="6">No hay usuarios registradas</td>
                </tr>
                {% endif %}
            </tbody>

        </table>
    </div>

</div>

{% endblock %}
